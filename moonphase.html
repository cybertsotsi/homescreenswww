
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black !important;
    overflow: hidden;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Remove widget backgrounds, borders and boxes */
  .moonphases,
  .moonphases_phase,
  .moonphases_launch,
  .moonphases_tiny {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    outline: none !important;
  }

  /* Remove all text and labels */
  .moonphases_text,
  .moonphases_illum_text,
  .moonphases_foot,
  .moonphases_date_text,
  .moonphases_logo {
    display: none !important;
  }

  /* Remove link decoration */
  .moonphases_launch {
    display: block !important;
    padding: 0 !important;
    margin: 0 !important;
    text-decoration: none !important;
  }
</style>

<script>
  const resizeMoon = setInterval(() => {
    const moon = document.querySelector('.moonphases_img');

    if (moon) {
      moon.style.setProperty('width', '25vw', 'important');
      moon.style.setProperty('height', '25vw', 'important');
      moon.style.setProperty('max-width', 'none', 'important');
      moon.style.setProperty('object-fit', 'contain', 'important');
      moon.style.setProperty('display', 'block', 'important');

      document.querySelectorAll(
        '.moonphases_text, .moonphases_illum_text, ' +
        '.moonphases_foot, .moonphases_date_text, .moonphases_logo'
      ).forEach(el => el.style.setProperty('display', 'none', 'important'));

      clearInterval(resizeMoon);
    }
  }, 100);
</script>
