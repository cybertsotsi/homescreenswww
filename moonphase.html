
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moon Phase</title>

  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
    }

    /* Centre the widget inside the dashboard box */
    body {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .moonphases {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      width: auto !important;
      height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      text-align: center !important;
      line-height: 0 !important;
    }

    /* Remove widget spacing and box styling */
    .moonphases div,
    .moonphases_phase,
    .moonphases_launch {
      display: block !important;
      width: auto !important;
      height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      float: none !important;
    }

    /* Keep moon at a fixed size */
    .moonphases_phase img,
    .moonphases_img {
      display: block !important;
      width: 300px !important;
      height: 300px !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      object-fit: contain !important;
      float: none !important;
    }

    /* Remove all labels and branding */
    .moonphases_text,
    .moonphases_illum_text,
    .moonphases_foot,
    .moonphases_date_text,
    .moonphases_logo,
    .moonphases_logo_small,
    .moonphase_right,
    .moonphases h2,
    .moonphases h3,
    .moonphases p {
      display: none !important;
    }

   /* Force-hide all widget text and labels */
.moonphases .moonphases_text,
.moonphases .moonphases_illum_text,
.moonphases .moonphases_foot,
.moonphases .moonphases_date_text,
.moonphases h2,
.moonphases h3,
.moonphases p {
  display: none !important;
  visibility: hidden !important;
  height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow: hidden !important;
} 
  </style>
</head>

<body>

  <script
    src="https://moonphases.co.uk/js/widget.js"
    id="moonphase_widget"
    widget="small-nodate"
    lat=""
    lng=""
    date=""
    tz="">
  </script>

  <script>
    const moonTimer = setInterval(function () {
      const moon = document.querySelector('.moonphases_img');

      if (moon) {
        moon.style.setProperty('width', '300px', 'important');
        moon.style.setProperty('height', '300px', 'important');
        moon.style.setProperty('max-width', 'none', 'important');
        moon.style.setProperty('margin', '0', 'important');
        moon.style.setProperty('padding', '0', 'important');
        moon.style.setProperty('border', '0', 'important');

        clearInterval(moonTimer);
      }
    }, 200);
  </script>

</body>
</html>
